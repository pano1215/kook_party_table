<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모꾸 — 좋아하는 사람들과 집에서 좀 더 특별하게</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
<style>
/* 모꾸(구 쿸) v0.3 — 핀 보드: 하얀 바탕 위에 음식 핀을 모으듯 메뉴를 고른다 */
:root{--paper:#FFFFFF;--ink:#211D1A;--quiet:#6F6862;--mist:#F1EFEC;--line:#E4E0DB;--berry:#B8336A;--berry-ink:#FFFFFF;--basil:#3F7D4E;--saffron:#F2B33D;--sky:#5C8DD6;--peach:#F7B39A;
  --danger:#C62828;--danger-soft:#FDECEA;--warn:#8A5A00;--warn-soft:#FFF4D6;--ok:#2E7D32;--ok-soft:#E7F4E8;--demo:#3F5AA8;--demo-soft:#EBEFFA;--surface:#FFFFFF;--bg:#FFFFFF;--olive:#B8336A;--olive-soft:#F8E6EE;--cream:#FFFFFF;--coral:#B8336A;--coral-soft:#F8E6EE}
@media (prefers-color-scheme:dark){:root{--paper:#141211;--ink:#F3EFEA;--quiet:#ABA39B;--mist:#24201E;--line:#36302C;--berry:#F06A9E;--berry-ink:#1A0C12;--danger:#FF8A80;--danger-soft:#3A1715;--warn:#F2C14E;--warn-soft:#332810;--ok:#81C784;--ok-soft:#163018;--demo:#9DB1F2;--demo-soft:#1C2238;--surface:#1C1917;--bg:#141211;--olive:#F06A9E;--olive-soft:#3A1726;--coral:#F06A9E;--coral-soft:#3A1726}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 "IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding:12px 16px 96px}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px)}
.brand{display:inline-flex;align-items:center;gap:8px;font-size:22px;font-weight:700;color:var(--ink);text-decoration:none;letter-spacing:-.6px}
.brand::before{content:"";width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--saffron) 0 28%,transparent 29%),var(--berry)}
h1{font-size:28px;line-height:1.25;margin:8px 0 6px;letter-spacing:-.8px}
h2{font-size:21px;margin:30px 0 10px;letter-spacing:-.4px}
h3{font-size:17px;margin:0;letter-spacing:-.2px}
p{margin:6px 0}
.muted{color:var(--quiet);font-size:14px}
.menu-desc{font-size:14.5px;line-height:1.65;color:var(--ink,#22384A);margin:6px 0 2px;word-break:keep-all}
.card{background:var(--surface);border-radius:24px;padding:20px;margin:14px 0;box-shadow:0 1px 2px rgba(33,29,26,.06),0 8px 24px rgba(33,29,26,.06)}
@media (prefers-color-scheme:dark){.card{box-shadow:none;border:1px solid var(--line)}}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1 1 160px}
label{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=password],input[type=tel],select,textarea{width:100%;min-height:50px;padding:12px 16px;border:2px solid transparent;border-radius:16px;background:var(--mist);color:var(--ink);font:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink);background:var(--surface)}
textarea{min-height:80px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 16px;border-radius:999px;cursor:pointer;font-size:15px;font-weight:600;background:var(--mist)}
.chip input{position:absolute;opacity:0;width:1px;height:1px}
.chip:has(input:checked){background:var(--ink);color:var(--paper)}
.chip:has(input:focus-visible){outline:3px solid var(--sky);outline-offset:2px}
.check{display:flex;gap:10px;align-items:flex-start;margin:12px 0;font-size:15px;font-weight:400}.check input{width:22px;height:22px;margin-top:2px;accent-color:var(--berry);flex:none}
button,.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:10px 20px;border-radius:999px;border:0;background:var(--mist);color:var(--ink);font:inherit;font-weight:700;cursor:pointer;text-decoration:none}
button:hover,.btn:hover{filter:brightness(.96)}
button:focus-visible,.btn:focus-visible,a:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
button.primary,.btn.primary{background:var(--berry);color:var(--berry-ink)}
button.small{min-height:38px;padding:6px 14px;font-size:14px}
button:disabled{opacity:.5;cursor:default}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:18px 0 6px;padding-bottom:4px;scrollbar-width:none}
.tabs button{min-height:42px;white-space:nowrap;padding:8px 16px;background:transparent;color:var(--ink)}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--paper)}
.note{border-radius:16px;padding:12px 16px;margin:10px 0;font-size:15px}
.note.danger{background:var(--danger-soft);color:var(--danger)}.note.warn{background:var(--warn-soft);color:var(--warn)}.note.ok{background:var(--ok-soft);color:var(--ok)}.note.demo{background:var(--demo-soft);color:var(--demo)}
.note ul{margin:4px 0 0;padding-left:20px}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--mist);color:var(--ink);margin:0 4px 4px 0}
.badge.danger{background:var(--danger-soft);color:var(--danger)}.badge.warn{background:var(--warn-soft);color:var(--warn)}.badge.demo{background:var(--demo-soft);color:var(--demo)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:sticky;top:60px;background:var(--paper);padding:8px 0;z-index:5}
.stat{background:var(--mist);border-radius:18px;padding:10px 14px}
.stat b{display:block;font-size:20px}.stat span{font-size:13px;color:var(--quiet)}
.stat.over b{color:var(--danger)}
.code{font:700 22px/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:3px;background:var(--mist);padding:8px 14px;border-radius:12px;display:inline-block}
.list{list-style:none;padding:0;margin:0}.list li{padding:12px 0;border-bottom:1px solid var(--line)}
.err{color:var(--danger);font-size:14px;margin:4px 0}
details summary{cursor:pointer;min-height:40px;display:flex;align-items:center;font-weight:700}
dialog{border:0;border-radius:24px;background:var(--surface);color:var(--ink);max-width:min(560px,92vw);padding:24px}
dialog::backdrop{background:rgba(0,0,0,.45)}
img.preview{max-width:100%;border-radius:20px;margin-top:8px}
/* 핀 보드: 높이가 다른 핀이 기둥처럼 쌓인다 */
.board{columns:4 200px;column-gap:14px;margin:6px 0}
.pin{break-inside:avoid;margin:0 0 16px;display:block;color:inherit;text-decoration:none}
.pin-art{position:relative;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:58px;line-height:1;overflow:hidden}
.pin-art .tag{position:absolute;left:10px;bottom:10px;font-size:12px;font-weight:700;background:rgba(255,255,255,.92);color:#211D1A;border-radius:999px;padding:3px 10px}
.pin-art .save{position:absolute;right:10px;top:10px;font-size:13px;font-weight:700;background:var(--berry);color:#fff;border-radius:999px;padding:6px 12px;opacity:0;transition:opacity .15s}
.pin:hover .save,.pin:focus-visible .save{opacity:1}
.pin-cap{padding:8px 6px 0}.pin-cap b{display:block;font-size:15px;letter-spacing:-.2px}.pin-cap span{font-size:13px;color:var(--quiet)}
.pin-art.has-img{background-size:cover;background-position:center}
.pin-art.has-img>span[aria-hidden]{visibility:hidden}
.credit{font-size:12px;color:var(--quiet);margin:4px 2px 0}
.t-basil{background:linear-gradient(160deg,#DCEFD8,#9CCB94)}.t-saffron{background:linear-gradient(160deg,#FFF0C7,#F6C35A)}.t-berry{background:linear-gradient(160deg,#FBD9E6,#E58AAE)}
.t-sky{background:linear-gradient(160deg,#DCE8FA,#94B5EA)}.t-peach{background:linear-gradient(160deg,#FFE6DA,#F5A98A)}.t-ink{background:linear-gradient(160deg,#E9E5E0,#BDB4AB)}
.h1x{height:150px}.h2x{height:210px}.h3x{height:270px}
/* 첫 화면 */
.start h1{font-size:34px;letter-spacing:-1.2px;margin:8px 0 6px}.start>p{max-width:46ch}
.board.big{columns:3 220px;margin-top:18px}.board.big .h1x{height:180px}.board.big .h2x{height:240px}.board.big .h3x{height:300px}.board.big .pin-art{font-size:64px}
.pin-cap b{font-size:16px}
.back{display:inline-block;margin:6px 0 4px;color:var(--quiet);text-decoration:none;font-weight:600}
.chosen{display:flex;gap:16px;align-items:center;margin:10px 0}.chosen .pin-art{width:120px;height:120px;flex:none;font-size:48px}.chosen h1{margin:0}.chosen p{margin:0}
.stepper{display:flex;align-items:center;gap:6px;background:var(--mist);border-radius:16px;padding:4px;width:max-content}
.stepper button{width:44px;min-height:44px;padding:0;font-size:22px;background:var(--surface)}
.stepper output{min-width:40px;text-align:center;font-size:22px;font-weight:700}.stepper .unit{margin-right:8px;color:var(--quiet)}
.hint{font-size:13px;color:var(--quiet);margin:6px 2px 0}.hint.warnt{color:var(--danger);font-weight:600}
.money{display:flex;align-items:center;gap:8px}.money input{flex:1}
input[aria-invalid=true]{border-color:var(--danger)}
.hero{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:28px;align-items:center;margin:8px 0 18px}
.hero h1{font-size:40px;line-height:1.15;letter-spacing:-1.6px;margin:0 0 12px}
.hero p{font-size:17px;color:var(--quiet);max-width:34ch}
.hero .board{columns:3 120px;column-gap:10px}.hero .pin{margin-bottom:10px}.hero .pin-art{font-size:42px}
.hero .h1x{height:110px}.hero .h2x{height:150px}.hero .h3x{height:190px}
@media (max-width:720px){.hero{grid-template-columns:1fr}.hero h1{font-size:32px}}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.step{display:inline-flex;align-items:center;gap:8px;background:var(--mist);border-radius:999px;padding:8px 14px 8px 8px;font-size:14px;font-weight:600}
.step .n{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--paper);font-weight:700;align-items:center;justify-content:center;font-size:13px}
.step b{font-weight:700}

/* create page editorial styling */
.create-hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,430px);gap:clamp(18px,3vw,36px);align-items:center;padding:18px 0 28px;margin:0 0 6px;border-bottom:1px solid #e5dfd4}
.create-copy{min-width:0;padding-right:10px}
.create-ornament{display:flex;align-items:center;gap:16px;margin:6px 0 18px;color:#BF8874;font-size:23px;line-height:1}
.create-hero .line-mark{width:56px;border-top:1px solid #A9A89A;display:inline-block}
.create-hero .flower-mark{display:inline-block;transform:rotate(-17deg)}
.create-hero h1{margin:4px 0 0;font-size:clamp(34px,4.2vw,54px);line-height:1.24;color:#31483C}
.create-hero .underline{margin-top:10px}
.create-lead{font-size:15px;color:#7A756D;margin:8px 0 10px}
.create-summary{max-width:42ch;color:#6f6a62;margin:0;padding-left:16px;border-left:1px solid #d3c7b6;font-size:14.5px;line-height:1.95}
.create-visual{position:relative;min-height:296px;background:linear-gradient(180deg,#f7f2e6,#f1ebdd);border-radius:34px 34px 10px 10px;overflow:hidden;box-shadow:0 18px 40px rgba(85,73,57,.07)}
.create-visual img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.create-visual::after{content:'';position:absolute;inset:14px;border:1px solid rgba(255,252,246,.88);border-radius:28px 28px 6px 6px;pointer-events:none}
.visual-tape{position:absolute;left:28px;top:18px;width:82px;height:22px;background:#d7d1c5;opacity:.72;border-radius:2px;transform:rotate(-7deg);z-index:2}
.visual-spark{position:absolute;right:18px;top:16px;color:#fefbf2;background:rgba(255,255,255,.56);border-radius:999px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:18px;z-index:2}
.create-form{margin-top:22px;border-radius:18px;padding:26px 24px 24px;background:#fffdfa;border:1px solid #e4ddd2;box-shadow:0 12px 36px rgba(85,73,57,.05)}
.create-form::before{content:'party details';display:block;font:italic 600 18px/1 'Cormorant Garamond',serif;letter-spacing:.08em;color:#B47B6F;margin-bottom:10px}
.party-name-label{font-family:'Noto Serif KR','Gowun Batang',serif;font-size:19px;font-weight:600;color:#344D42;margin-top:0;margin-bottom:10px}
.create-form .row{gap:14px 16px;margin-top:4px}
.create-form .row + .row{margin-top:6px}
.create-form label,.create-form .flabel,.create-form fieldset.opts legend{font-family:'Noto Serif KR','Gowun Batang',serif;font-size:17px;font-weight:600;color:#344D42;margin-bottom:8px}
.create-form fieldset.opts{margin-top:22px;padding-top:18px;border-top:1px solid #ede7dd}
.create-form .hint{font-size:12.8px;line-height:1.55;color:#8b877f}
.create-form .stepper{padding:5px;background:#fcfaf5;border:1px solid #dfd8cc}
.create-form .stepper output{font-family:'Noto Serif KR','Gowun Batang',serif;font-size:24px;color:#355048}
.create-form .stepper .unit{font-size:13px}
.create-form .money span{color:#80776d}
.create-form button[type=submit].primary{margin-top:22px;min-height:54px;font-family:'Noto Sans KR',sans-serif;font-size:15px;border-radius:10px;letter-spacing:-.02em}
.reentry-row{margin-top:12px}
.reentry-card{background:#fcfaf6;border-radius:14px;border:1px solid #e7dfd3;box-shadow:none}
.reentry-card h3{margin:0 0 2px;font-size:21px}
.reentry-card::before{content:'';display:block;width:34px;height:3px;background:#d8cfbf;border-radius:999px;margin-bottom:14px}
@media (max-width:900px){.create-hero{grid-template-columns:1fr;gap:20px;padding-bottom:24px}.create-copy{padding-right:0}.create-visual{min-height:250px}.create-hero h1{font-size:clamp(32px,8vw,44px)}}
@media (max-width:560px){.create-form{padding:20px 16px}.create-form::before{font-size:17px}.party-name-label,.create-form label,.create-form .flabel,.create-form fieldset.opts legend{font-size:16px}.create-summary{padding-left:12px}}
/* 게스트 초대장 */
.invite{border-radius:28px;padding:26px 22px;margin:8px 0 16px;background:var(--berry);color:#fff;position:relative;overflow:hidden}
.invite::after{content:"🍽️";position:absolute;right:-10px;bottom:-24px;font-size:120px;opacity:.22;transform:rotate(-12deg)}
.invite .from{font-size:14px;opacity:.9}.invite h1{font-size:30px;margin:6px 0}.invite .muted{color:rgba(255,255,255,.85)}
.q{font-size:18px;font-weight:700;margin:26px 0 2px;letter-spacing:-.3px}.q+.hint{font-size:14px;color:var(--quiet);margin:0 0 10px}
.picks{columns:3 96px;column-gap:10px}
.pick{break-inside:avoid;display:block;margin:0 0 10px;cursor:pointer;font-weight:600;font-size:14px;text-align:center}
.pick input{position:absolute;opacity:0;width:1px;height:1px}
.pick .pin-art{font-size:40px;border:3px solid transparent}
.pick .pin-art::after{content:"✓";position:absolute;right:8px;top:8px;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:15px;display:none;align-items:center;justify-content:center}
.pick:has(input:checked) .pin-art{border-color:var(--ink)}.pick:has(input:checked) .pin-art::after{display:flex}
.pick:has(input:focus-visible) .pin-art{outline:3px solid var(--sky);outline-offset:2px}
.pick .h1x{height:86px}.pick .h2x{height:112px}
/* 호스트 */
.tabdesc{font-size:14px;color:var(--quiet);margin:4px 2px 8px}
.tabdesc b{color:var(--ink)}
.menu{padding:0;overflow:hidden}
.menu .pin-art{border-radius:0;height:150px;font-size:64px}
.menu .body{padding:14px 16px 16px}
.menu .head{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.menu .cost{font-weight:700;white-space:nowrap}
.menu.out .pin-art{filter:grayscale(1);opacity:.55}
.menu-board{columns:2 260px;column-gap:14px}.menu-board .card{break-inside:avoid;margin:0 0 14px}
.plist{list-style:none;padding:0;margin:0}.plist li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.plist .past{opacity:.65}
.ready{font-size:12px;font-weight:700;color:var(--berry);background:var(--olive-soft);border-radius:999px;padding:2px 9px;margin-left:6px;white-space:nowrap}
.ops-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:16px 0}
.ops-kpis div{background:var(--mist);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column}.ops-kpis b{font-size:28px;letter-spacing:-.5px}.ops-kpis span{color:var(--quiet);font-size:13px}
.ops-table{overflow-x:auto;margin:8px 0}.ops-table table{border-collapse:collapse;font-size:14px;min-width:820px;width:100%}
.ops-table th,.ops-table td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}.ops-table th[scope=row],.ops-table thead th:first-child{text-align:left}
.ops-table thead th{font-size:12px;color:var(--quiet);font-weight:600}.ops-table .rate{color:var(--berry)}.ops-table tr.sum{font-weight:700}.ops-table tr.sum th,.ops-table tr.sum td{border-bottom:0}
.chlink{font-size:12px;word-break:break-all}
.btn.soon{color:var(--quiet);border-style:dashed;gap:8px}.soon-tag{font-size:11px;font-weight:700;background:var(--mist);color:var(--quiet);border-radius:999px;padding:2px 8px}
.soon-note{margin-top:4px}
.privacy{background:var(--mist);border-radius:14px;padding:12px 14px;margin-top:14px;font-size:13px}.privacy p{margin:0 0 6px}
.privacy table{border-collapse:collapse;width:100%;margin:4px 0 8px}.privacy th,.privacy td{text-align:left;vertical-align:top;padding:4px 0;border-bottom:1px solid var(--line)}.privacy th{width:96px;font-weight:600;color:var(--quiet)}
fieldset.opts{border:0;padding:0;margin:18px 0 0;min-width:0}fieldset.opts legend{font-weight:700;font-size:14px;padding:0;margin-bottom:8px}
fieldset.opts .money{margin-top:10px}fieldset.opts #kindEtc{margin-top:10px}
.apps{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.btn.app{min-height:42px;padding:8px 16px;color:#fff}
.btn.baemin{background:#2AC1BC}.btn.coupang{background:#1F1F1F}.btn.ddangyo{background:#E8402F}
.msgs li{padding:8px 0;border-bottom:1px solid var(--line)}
.letter-pop{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,18,17,.45);z-index:50;animation:lpFade .2s ease-out}
.letter-pop .box{background:var(--surface);color:var(--ink);border-radius:28px;padding:30px 32px;text-align:center;max-width:300px;width:calc(100% - 48px);box-shadow:0 20px 50px rgba(0,0,0,.3);animation:lpUp .35s cubic-bezier(.2,.8,.3,1.2)}
.letter-pop .env{font-size:58px;line-height:1;display:block;margin-bottom:12px;animation:lpFly 1.1s ease-in-out .15s both}
.letter-pop b{display:block;font-size:20px;margin-bottom:6px}
@keyframes lpFade{from{opacity:0}to{opacity:1}}
@keyframes lpUp{from{transform:translateY(24px) scale(.96);opacity:0}to{transform:none;opacity:1}}
@keyframes lpFly{0%{transform:translateY(8px) rotate(-8deg)}50%{transform:translateY(-10px) rotate(6deg)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.letter-pop,.letter-pop .box,.letter-pop .env{animation:none}.pin-art .save{transition:none}}

/* ---------- 모꾸 v0.4 — A little party, a lot of love: 크림 바탕, 네이비 글자, 버터·코랄·세이지는 포인트로만 ---------- */
:root{--paper:#FFF8ED;--bg:#FFF8ED;--surface:#FFFFFF;--ink:#22384A;--quiet:#4F6475;--mist:#F6EFE2;--line:#EADFCC;--field:#DDD1BD;
  --navy:#35566E;--butter:#F5D99B;--coral:#E9A6A1;--sage:#A9C4B0;--butter-soft:#FBEFD2;--coral-soft:#FBE7E5;--sage-soft:#E3EEE6;--sky-soft:#E3EAF0;
  --berry:#35566E;--berry-ink:#FFF8ED;--olive:#35566E;--olive-soft:#E3EAF0;

  --navy:#9FBDD3;--butter:#E8C877;--coral:#E9A6A1;--sage:#A9C4B0;--butter-soft:#3A3322;--coral-soft:#3D2A2A;--sage-soft:#22352B;--sky-soft:#253442;
  --berry:#9FBDD3;--berry-ink:#18222C;--olive:#9FBDD3;--olive-soft:#253442;--danger:#F0A49C;--danger-soft:#3D2A2A;--warn:#E8C877;--warn-soft:#3A3322;--ok:#A9C4B0;--ok-soft:#22352B;--demo:#B5C9DA;--demo-soft:#253442;--sky:#9FBDD3}}
body{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15.5px;line-height:1.7}

.q{font-size:18px;margin-top:24px}

/* 왼쪽 이전 파티 목록: 접으면 좁은 띠만 남는다 */

.shell.collapsed .side{width:64px}.shell.collapsed .side-body{display:none}.shell.collapsed .side-head{justify-content:center}

.side-backdrop{display:none}
@media (max-width:759px){

/* ============================================================
   MOKKU / THE GATHERING — complete visual re-art direction
   Only visual markup and stylesheet; existing copy and flows retained.
   ============================================================ */
:root{color-scheme:light;
  --paper:#F8F6F1;--bg:#F8F6F1;--surface:#FFFEFB;--cream:#F8F6F1;
  --ink:#303832;--quiet:#7D8078;--mist:#F0ECE4;--line:#E5E0D6;--field:#DDD7C9;
  --navy:#3D5549;--berry:#3D5549;--berry-ink:#FFFDF7;--olive:#6F806B;--olive-soft:#EDF1EA;
  --coral:#C77A68;--coral-soft:#F5E8DE;--butter:#EACF99;--saffron:#EACF99;--sage:#A5B3A1;
  --sky:#7A9BA0;--sky-soft:#E8EFED;--butter-soft:#F6EAD3;--peach:#EAB8A6;
  --ok:#43694F;--ok-soft:#E5EEE4;--warn:#9E6F38;--warn-soft:#FAEBD3;--danger:#AB5548;--danger-soft:#FBECE8;
}
html{scroll-behavior:smooth}
body{background:var(--paper);background-image:none;color:var(--ink);font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;font-size:14.5px;line-height:1.75;letter-spacing:-.025em;word-break:keep-all}
.wrap{max-width:1380px;margin:0 auto;padding:0 clamp(20px,4vw,80px) 85px}
header.top{position:relative;top:auto;z-index:20;padding:19px 0 22px;border-bottom:1px solid #DED9CF;background:transparent;backdrop-filter:none}
.brand{font-family:'Noto Serif KR',serif;font-weight:700;font-size:23px;letter-spacing:-.07em;color:#344E43;gap:14px}
.brand::before{display:none}
.brand .script{font:italic 500 17px/1 'Cormorant Garamond',Georgia,serif;color:#B47B6F;letter-spacing:.035em;white-space:nowrap}
h1,h2,h3{color:#344D42;font-family:'Noto Serif KR','Gowun Batang',serif;font-weight:600;letter-spacing:-.055em}
h1{font-size:clamp(30px,3.6vw,48px);line-height:1.3}
h2{font-size:clamp(22px,2.3vw,29px)}h3{font-size:19px}
.card{border-radius:9px;border:1px solid #E4DFD6;background:#FFFEFA;padding:clamp(18px,2.4vw,30px);box-shadow:0 9px 36px #55493908}
button,.btn{border-radius:8px;font-size:14px;font-weight:600;letter-spacing:-.035em;transition:background .22s,border-color .22s,transform .22s,box-shadow .22s}
button:hover:not(:disabled),.btn:hover{filter:none;transform:translateY(-2px)}
button.primary,.btn.primary{color:#FFFDF7;background:#415E50;border:1px solid #415E50}
button.primary:hover,.btn.primary:hover{background:#314B3F;box-shadow:0 8px 20px #3B55412B}
button:focus-visible,.btn:focus-visible,a:focus-visible{outline:2px solid #C58F67;outline-offset:4px}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=password],input[type=tel],select,textarea{background:#FDFCFA;border:1px solid var(--field);border-radius:8px;min-height:48px}
input:focus,select:focus,textarea:focus{border-color:var(--olive);box-shadow:0 0 0 3px #98AD9840}
.chip{background:#F8F7F3;border:1px solid #E5E0D6;border-radius:999px;font-weight:500;font-size:13px}
.chip:has(input:checked){background:#E1EBE1;color:#395347;border-color:#92A694}
.tabs button[aria-selected=true]{color:var(--navy)}.badge{background:#E6EDE5;color:#496450}
.side{background:#F0EDE6;border-right:1px solid #E6E0D7}.side-new{background:#E3E9DF;color:#3D5549;border-radius:8px}.side-item.cur{background:#FFFCF6;border:1px solid #DBD8CE;box-shadow:none}.side-label{font-size:11px;letter-spacing:.13em;text-transform:uppercase}
.invite{background:#FFFCF6;color:#344D42;box-shadow:inset 0 0 0 1px #E3D8CB,inset 0 0 0 7px #FFFCF6,inset 0 0 0 8px #E3D8CB;border-radius:8px}
.foot-line{font:italic 500 23px/1.2 'Cormorant Garamond',serif;letter-spacing:.07em;color:#B78B80;margin-top:34px}
/* Hero is a lifestyle editorial cover rather than an illustration/card layout. */
.hello{display:flex;flex-direction:column;gap:0;margin:0}
.hello-top{display:grid;grid-template-columns:minmax(0,.93fr) minmax(0,1.07fr);align-items:stretch;gap:clamp(20px,2.5vw,42px);min-height:562px;padding:clamp(24px,4vw,60px) 0 82px;position:relative;border-bottom:1px solid #DCD8CE}
.hello-top::before{content:'';position:absolute;inset:0 auto 0 -8vw;width:56%;background:radial-gradient(ellipse at 22% 48%,#F5E9DC 0,rgba(245,233,220,.55) 27%,transparent 70%);z-index:0;pointer-events:none}
.hero-copy{position:relative;z-index:1;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;min-width:0;padding:30px 4px 32px 0}
.hero-ornament{display:flex;align-items:center;gap:16px;margin-bottom:29px;color:#BF8874;font-size:24px;line-height:1}
.hero-ornament .line-mark{width:58px;border-top:1px solid #A9A89A;display:inline-block}

.hello h1{font-family:'Noto Serif KR','Nanum Myeongjo',serif;font-weight:500;font-size:clamp(48px,5.2vw,79px);line-height:1.36;letter-spacing:-.088em;white-space:pre-line;color:#31483C;margin:0 0 26px}
.hello-top .hero-copy>p{font-size:clamp(14px,1.11vw,16px);color:#736F65;line-height:2.08;max-width:38ch;letter-spacing:-.035em;margin:0;border-left:1px solid #C0B7A6;padding-left:18px}
.hero-toast-sticker{display:block;width:clamp(108px,13vw,178px);height:auto;object-fit:contain;margin:19px 0 0 16%;transform:rotate(-10deg);filter:drop-shadow(0 12px 10px #473F3412)}

.hero-collage .photo-main{position:relative;width:100%;height:clamp(420px,41vw,545px);border:10px solid #FFFEF9;border-bottom-width:22px;box-shadow:0 20px 44px #4E463427;overflow:hidden;transform:rotate(1.8deg);border-radius:3px}

.collage-doodle{position:absolute;bottom:-26px;right:4%;color:#B88B7B;font-size:60px;letter-spacing:-18px;transform:rotate(-11deg);font-family:serif}
/* Occasion collection: picture + type, not six identical office-style form buttons. */
.hello>.ask{font:500 clamp(23px,2.1vw,31px)/1.5 'Noto Serif KR',serif;letter-spacing:-.06em;color:#384D40;margin:58px 0 24px;text-align:center}
.hello>.ask::before{content:'✳';display:block;margin-bottom:10px;color:#CF9D83;font:normal 27px/1 Georgia,serif}
.moods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.mood{isolation:isolate;display:flex;position:relative;flex-direction:column;align-items:flex-start;justify-content:flex-end;width:100%;height:215px;min-height:0;padding:0 20px 19px;overflow:hidden;border:1px solid #E3DDD2;border-radius:3px;background:#F6F0E6;box-shadow:0 5px 15px #5049380A;text-align:left;font-weight:400;transition:transform .22s,box-shadow .22s,border-color .22s,background .22s}
.mood::before{content:'';display:block;position:absolute;inset:0 0 75px;z-index:-1;background-size:cover;background-position:center;filter:saturate(.82);transition:transform .3s,filter .3s}
/* Unified collection artwork: six separate scenes, one illustrated art direction. */
.mood::before{background-position:center center;background-size:cover;filter:saturate(.95) contrast(1.01)}
.mood:nth-child(1)::before{background-image:url('assets/mood-housewarming.webp')}
.mood:nth-child(2)::before{background-image:url('assets/mood-birthday.webp')}
.mood:nth-child(3)::before{background-image:url('assets/mood-cozy-dinner.webp')}
.mood:nth-child(4)::before{background-image:url('assets/mood-home-bar.webp')}
.mood:nth-child(5)::before{background-image:url('assets/mood-brunch.webp')}
.mood:nth-child(6)::before{background-image:url('assets/mood-yearend.webp')}
.mood::after{content:'';position:absolute;top:8px;right:12px;width:17px;height:17px;border-radius:50%;background:#FFF8E6;opacity:.88;box-shadow:0 0 0 4px #FFF6E66B}

.mood:hover::before{transform:scale(1.05)}

// 화면의 [data-img] 칸에 사진을 채운다. 위키백과 대표 이미지를 한 번에 묻고 이 브라우저에 기억한다. 못 받으면 그림 이모지가 남는다
async function loadImages() {
  const els = [...document.querySelectorAll("[data-img]")];
  const want = [...new Set(els.map((e) => e.dataset.img).filter((t) => t && !(t in imgCache)))];
  for (let i = 0; i < want.length; i += 40) {
    const batch = want.slice(i, i + 40);
    try {
      const r = await fetch(`https://en.wikipedia.org/w/api.php?action=query&prop=pageimages&pithumbsize=640&redirects=1&format=json&origin=*&titles=${encodeURIComponent(batch.join("|"))}`);
      const j = await r.json(), q = j.query || {}, back = {};
      for (const n of q.normalized || []) back[n.to] = n.from;
      for (const n of q.redirects || []) back[n.to] = back[n.from] || n.from;
      for (const pg of Object.values(q.pages || {})) imgCache[back[pg.title] || pg.title] = pg.thumbnail ? pg.thumbnail.source : "";
      batch.forEach((t) => { if (!(t in imgCache)) imgCache[t] = ""; });
      safeSet(IMG_KEY, JSON.stringify(imgCache));
    } catch { return; }
  }
  for (const el of document.querySelectorAll("[data-img]")) {
    const u = imgCache[el.dataset.img];
    if (u && !el.classList.contains("has-img")) { el.style.backgroundImage = `url("${u.replace(/"/g, "")}")`; el.classList.add("has-img"); }
  }
}

// ------------------------------------------------------------ Groq 호출(설정에 키가 있을 때만)
class ModelError extends Error { constructor(m, raw) { super(m); this.raw = raw || ""; } }
async function callJson(content, onWait, partyId) {
  if (!apiKey() && SERVER.ai) {   // 서버판: 키는 서버에만 있고 서버가 대신 부른다. 서버는 이 파티의 호스트인지 확인한다
    const j = await api("/api/ai", { method: "POST", body: { content, party: partyId || "" }, headers: { "x-host-code": partyId ? hostCode(partyId) : "" } }).catch((e) => { throw new ModelError(e.message); });
    try { const d = JSON.parse(j.raw); if (d && typeof d === "object" && !Array.isArray(d)) return d; } catch {}
    throw new ModelError("모델 응답을 JSON으로 읽지 못했어요. 다시 눌러 보세요.", j.raw);
  }
  for (let attempt = 1; attempt <= 3; attempt++) {
    let res;
    try {
      res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
        method: "POST", headers: { "Content-Type": "application/json", Authorization: `Bearer ${apiKey()}` },
        body: JSON.stringify({ model: GROQ_MODEL, messages: [{ role: "user", content }], response_format: { type: "json_object" }, temperature: 0.4, max_completion_tokens: 4096 }),
      });
    } catch (e) { throw new ModelError("Groq에 연결하지 못했어요. 네트워크나 브라우저 보안 설정(CORS)을 확인해 주세요."); }
    if (res.status === 429 && attempt < 3) { const wait = 3 * 2 ** (attempt - 1); onWait && onWait(attempt, wait); await new Promise((r) => setTimeout(r, wait * 1000)); continue; }
    if (res.status === 429) throw new ModelError("Groq API 요청 한도를 넘었어요. 잠시 뒤 다시 시도해 주세요.");
    if (!res.ok) throw new ModelError(`Groq 요청이 실패했어요(${res.status}). API 키를 확인해 주세요.`, await res.text().catch(() => ""));
    const raw = ((await res.json()).choices?.[0]?.message?.content || "").trim();
    try { const d = JSON.parse(raw); if (d && typeof d === "object" && !Array.isArray(d)) return d; } catch {}
    throw new ModelError("모델 응답을 JSON으로 읽지 못했어요. 다시 눌러 보세요.", raw);
  }
}

  if (first || force || before !== JSON.stringify([CACHE.parties, CACHE.invites])) render();
}
window.addEventListener("hashchange", () => {
  if (narrow() && sideOpen) toggleSide(false);
  render();
  if (!(ui.toCodes && Date.now() - ui.toCodes < 1500)) window.scrollTo(0, 0);   // 화면이 바뀌면 맨 위에서 시작한다('코드로 파티 열기'로 온 경우만 예외)
  sync();
});
// 호스트 화면은 10초마다 새 카드를 받아 온다(무언가 입력하는 중이면 건너뜀)
setInterval(() => {
  if (!REMOTE || ui.busy || document.hidden || !/^#\/host\//.test(location.hash)) return;
  if (document.activeElement?.matches("input,textarea,select") || document.querySelector("details[open] form, .letter-pop, .share-pop, dialog[open]")) return;
  sync();
}, 10000);
window.addEventListener("storage", (e) => { if (!REMOTE && e.key === STORE_KEY && !ui.busy && !document.activeElement?.matches("input[type=text],textarea")) render(); });
// ------------------------------------------------------------ 운영 기록(#/ops)
// 채널별 퍼널: 방문 → 파티 생성 → 초대 링크 전달 → 카드 제출 → 메뉴 추천. 사람·파티는 중복 없이 센다
const FUNNEL = [
  ["visitors", "방문자", "처음 화면을 연 사람(익명 방문자 ID 기준, 중복 없음)"],
  ["created", "파티 생성", "호스트가 만든 파티 수"],
  ["shared", "초대 링크 전달", "초대 링크를 복사·전달한 횟수(같은 파티를 여러 번 보내면 모두 셈)"],
  ["sharedParties", "링크 보낸 파티", "초대 링크를 한 번 이상 보낸 파티 수"],
  ["guestVisitors", "게스트 방문", "초대 링크를 연 게스트 수(중복 없음)"],
  ["cards", "카드 제출", "게스트가 써서 보낸 취향 카드 수(고친 것은 제외)"],
  ["carded", "카드 받은 파티", "카드를 한 장 이상 받은 파티 수"],
  ["planned", "메뉴 추천", "게스트 취향으로 메뉴를 추천받은 횟수(다시 추천도 모두 셈)"],
  ["plannedParties", "추천받은 파티", "메뉴를 한 번 이상 추천받은 파티 수"],
];
function funnelRows(ev) {
  const blank = () => ({ visitors: new Set(), created: new Set(), shared: 0, sharedParties: new Set(), guestVisitors: new Set(), cards: 0, carded: new Set(), planned: 0, plannedParties: new Set() });
  const by = {}, total = blank();
  const add = (row, e) => {
    if (e.ev === "visit" && e.role !== "guest") row.visitors.add(e.vid || e.t);
    else if (e.ev === "visit") row.guestVisitors.add(e.vid || e.t);
    else if (e.ev === "party_created") row.created.add(e.party);
    else if (e.ev === "invite_shared") { row.shared++; row.sharedParties.add(e.party); }
    else if (e.ev === "card_sent") { row.cards++; row.carded.add(e.party); }
    else if (e.ev === "plan_made") { row.planned++; row.plannedParties.add(e.party); }
  };
  for (const e of ev) { const ch = e.ch || normChannel(e.src); add((by[ch] = by[ch] || blank()), e); add(total, e); }
  const n = (r) => Object.fromEntries(Object.entries(r).map(([k, v]) => [k, typeof v === "number" ? v : v.size]));
  const keys = CHANNELS.map(([k]) => k).concat(EXTRA_CH.map(([k]) => k).filter((k) => by[k]));
  return { rows: keys.map((k) => [k, n(by[k] || blank())]), total: n(total) };
}
const fmtTime = (iso) => { const d = new Date(iso); return isNaN(d) ? String(iso || "") : d.toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }); };
const pct = (a, b) => (b ? `${Math.round((a / b) * 100)}%` : "–");
function opsSummary(data) {
  const ev = data.events || [], leads = data.leads || [];
  const { rows, total } = funnelRows(ev);
  const tr = (label, r, cls = "") => `<tr class="${cls}"><th scope="row">${esc(label)}</th>${FUNNEL.map(([k]) => `<td>${r[k]}</td>`).join("")}
    <td class="rate">${pct(r.created, r.visitors)}</td><td class="rate">${pct(r.sharedParties, r.created)}</td><td class="rate">${pct(r.carded, r.created)}</td><td class="rate">${pct(r.plannedParties, r.created)}</td></tr>`;
  const others = { delivery_click: 0, interview_signup: 0 }, soon = { groceries: 0, mealkit: 0, delivery: 0 };
  const via = { kakao: 0, instagram: 0, copy: 0 };
  ev.forEach((e) => { if (e.ev in others) others[e.ev]++; if (e.ev === "order_interest") soon[e.kind || "delivery"] = (soon[e.kind || "delivery"] || 0) + 1; if (e.ev === "invite_shared") via[e.kind || "copy"] = (via[e.kind || "copy"] || 0) + 1; });
  return { ev, leads, html: `
    <div class="ops-kpis">
      <div><b>${total.visitors}</b><span>방문자</span></div><div><b>${total.created}</b><span>파티 생성</span></div><div><b>${total.shared}</b><span>링크 전달(횟수)</span></div>
      <div><b>${total.cards}</b><span>카드 제출</span></div><div><b>${total.planned}</b><span>메뉴 추천(횟수)</span></div>
    </div>
    <div class="ops-table"><table>
      <thead><tr><th scope="col">채널</th>${FUNNEL.map(([, l, d]) => `<th scope="col" title="${esc(d)}">${l}</th>`).join("")}<th scope="col" class="rate">방문→파티</th><th scope="col" class="rate">파티→링크</th><th scope="col" class="rate">파티→카드</th><th scope="col" class="rate">파티→추천</th></tr></thead>
      <tbody>${rows.map(([k, r]) => tr(CH_LABEL[k] || k, r)).join("")}${tr("합계", total, "sum")}</tbody>
    </table></div>
    <p class="muted">파티에 딸린 행동(링크 전달·게스트 방문·카드·추천)은 호스트가 처음 들어온 채널로 묶어 세요. 비율의 분모는 왼쪽 단계 값이에요. 기록 ${ev.length.toLocaleString()}건 · 배달앱 이동 ${others.delivery_click}회 · 인터뷰 신청 ${leads.length}건</p>
    <p class="muted">초대 링크 전달 방법: 카카오톡 ${via.kakao}회 · 인스타그램 ${via.instagram}회 · 링크 복사 ${via.copy}회</p>
    <p class="muted">바로 주문(준비 중) 버튼 클릭: 재료 ${soon.groceries}회 · 밀키트 ${soon.mealkit}회 · 배달 ${soon.delivery}회</p>
    <h2>인터뷰 신청 <span class="muted" style="font-size:15px;font-weight:400">${leads.length}건 · 신청일로부터 ${LEAD_KEEP_DAYS}일 뒤 자동 삭제</span></h2>
    ${leads.length ? `<div class="ops-table"><table><thead><tr><th scope="col">신청 시각</th><th scope="col">역할</th><th scope="col">채널</th><th scope="col">휴대폰 번호</th><th scope="col">동의 시각</th><th scope="col">안내 버전</th></tr></thead>
      <tbody>${leads.map((l) => { const ch = normChannel(l.src); return `<tr><th scope="row">${esc(fmtTime(l.t))}</th><td>${l.role === "guest" ? "게스트" : "호스트"}</td><td>${esc(CH_LABEL[ch] || ch)}</td><td>${esc(l.phone)}</td><td>${l.consent ? esc(fmtTime(l.consent.at)) : "기록 없음"}</td><td>${l.consent ? esc(l.consent.notice) : "–"}</td></tr>`; }).join("")}</tbody></table></div>` : '<p class="muted">아직 신청이 없어요.</p>'}
    <button type="button" class="small" id="opsCsv">CSV 내려받기</button>` };
}
function opsView() {
  const base = location.href.split("#")[0].split("?")[0];
  return `<a class="back" href="#/">← 처음으로</a>
  <h1>운영 기록</h1>
  <p class="muted">채널별로 사람들이 어디까지 왔는지 봐요. ${REMOTE ? "서버에 쌓인 기록이에요." : "서버가 없는 시연판이라 이 브라우저에 쌓인 기록만 보여요."}</p>
  ${REMOTE ? `<form class="card" id="opsForm"><label for="opsKey">운영자 키(OPS_KEY)</label><div class="money"><input id="opsKey" type="password" autocomplete="off" value="${esc(safeGet("kook.opskey", sessionStorage) || "")}"><button class="primary" type="submit">기록 보기</button></div><div id="opsErr"></div></form>` : ""}
  <div id="opsOut">${REMOTE ? "" : opsSummary(localOps()).html}</div>
  <div class="card"><h3>채널별 링크</h3><p class="muted">채널마다 아래 링크를 올리면 그 채널로 들어온 사람으로 세요.</p>
    <ul class="list">${CHANNELS.map(([k, l]) => `<li class="row" style="align-items:center"><span><b>${l}</b><br><span class="muted chlink">${esc(base)}?src=${k}</span></span><button type="button" class="small" style="flex:0 0 auto" data-chlink="${esc(base)}?src=${k}">복사</button></li>`).join("")}</ul></div>`;
}
function localOps() { try { return { events: JSON.parse(safeGet(EVENTS_KEY) || "[]"), leads: JSON.parse(safeGet(LEADS_KEY) || "[]") }; } catch { return { events: [], leads: [] }; } }
let OPS = null;   // 화면에 띄운 운영 기록(CSV용)
function bindOps() {
  document.querySelectorAll("[data-chlink]").forEach((b) => (b.onclick = async () => { try { await navigator.clipboard.writeText(b.dataset.chlink); b.textContent = "복사됨"; } catch { prompt("링크", b.dataset.chlink); } }));
  const bindCsv = () => { const c = $("#opsCsv"); if (c) c.onclick = () => downloadOpsCsv(OPS); };
  if (!REMOTE) { OPS = localOps(); bindCsv(); return; }
  const load = async () => {
    const key = $("#opsKey").value.trim(); if (!key) return;
    try { OPS = await api("/api/ops", { headers: { "x-ops-key": key } }); safeSet("kook.opskey", key, sessionStorage); $("#opsErr").innerHTML = ""; $("#opsOut").innerHTML = opsSummary(OPS).html; bindCsv(); }
    catch (e) { $("#opsErr").innerHTML = `<p class="err">${esc(e.message)}</p>`; }
  };
  $("#opsForm").onsubmit = (e) => { e.preventDefault(); load(); };
  load();
}
function downloadOpsCsv(data) {
  const ev = (data && data.events) || [], leads = (data && data.leads) || [];
  const q = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const csv = ["kind,time,event_or_role,channel,channel_label,role,visitor,party,phone,consent_at,notice_version"]
    .concat(ev.map((e) => { const ch = e.ch || normChannel(e.src); return ["event", e.t, e.kind ? `${e.ev}:${e.kind}` : e.ev, ch, CH_LABEL[ch] || ch, e.role || "", e.vid || "", e.party || "", "", "", ""].map(q).join(","); }),
      leads.map((l) => { const ch = normChannel(l.src); return ["lead", l.t, l.role, ch, CH_LABEL[ch] || ch, l.role, "", l.party, l.phone, l.consent ? l.consent.at : "", l.consent ? l.consent.notice : ""].map(q).join(","); }))
    .join("\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" })); a.download = "kook_tracking.csv"; a.click();
}
render();
if (REMOTE) {
  api("/api/config").then((c) => { SERVER.ai = !!c.ai; SERVER.storage = !!c.storage; SERVER.kakao = c.kakao || ""; SERVER.checked = true; setMode(); if (!SERVER.storage && (location.hash || "#/") === "#/") render(); }).catch(() => {});
  sync();
}
</script>
